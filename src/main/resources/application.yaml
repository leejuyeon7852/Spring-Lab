spring:
  application:
    name: ecs-lab

  datasource:
    url: jdbc:mysql://localhost:3307/spring_lab
    username: user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 604800000 # 7일